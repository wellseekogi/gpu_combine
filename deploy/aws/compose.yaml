name: relay
services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/aws/Dockerfile
    image: relay-coordinator:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      RELAY_PUBLIC_ORIGIN: https://${RELAY_DOMAIN:?Set RELAY_DOMAIN in deploy/aws/.env}
      RELAY_SECURE_COOKIE: "1"
      RELAY_TRUST_PROXY: "1"
    volumes:
      - relay_data:/var/lib/relay
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/',{headers:{'X-Real-IP':'127.0.0.1'},signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN in deploy/aws/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  edge:
  backend:
    internal: true
volumes:
  relay_data:
    name: relay_data
  caddy_data:
    name: relay_caddy_data
  caddy_config:
    name: relay_caddy_config
