name: Publish provider update

on:
  push:
    tags:
      - "provider-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (for example provider-v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: provider-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Validate the version tag and repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content -LiteralPath provider/update-config.json -Raw | ConvertFrom-Json
          $version = (Get-Content -LiteralPath provider/version.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid provider version' }
          if ($env:RELEASE_TAG -cne ($config.release_tag_prefix + $version)) { throw 'Release tag must exactly match provider/version.json' }
          if ($config.repository -cne $env:GITHUB_REPOSITORY) { throw 'Update repository does not match this repository' }
          $tagCommit = git rev-parse --verify "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The exact provider version tag must already exist' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $headCommit) { throw 'Checked out source differs from the release tag' }

      - name: Test provider and updater
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "*_test.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Provider tests failed' }
          node --test tests/provider-package.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Provider package tests failed' }

      - name: Build the exact release assets
        shell: pwsh
        run: |
          node scripts/package-provider.mjs --out outputs/provider-release
          if ($LASTEXITCODE -ne 0) { throw 'Provider packaging failed' }
          $manifest = Get-Content -LiteralPath outputs/provider-release/relay-provider-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.tag -cne $env:RELEASE_TAG) { throw 'Packaged version differs from the release tag' }
          $archive = Get-Item -LiteralPath outputs/provider-release/relay-provider.zip
          $digest = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $manifest.archive.sha256 -or $archive.Length -ne $manifest.archive.size) { throw 'Package integrity check failed' }

      - name: Publish verified assets without changing an existing version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content -LiteralPath provider/update-config.json -Raw | ConvertFrom-Json
          $manifest = Get-Content -LiteralPath outputs/provider-release/relay-provider-manifest.json -Raw | ConvertFrom-Json
          $repository = $config.repository
          $tag = $env:RELEASE_TAG
          $assets = @($config.archive_asset, $config.manifest_asset)
          $releaseJson = gh release list --repo $repository --limit 1000 --json tagName,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect existing releases' }
          $releases = @($releaseJson | ConvertFrom-Json)
          $existing = @($releases | Where-Object { $_.tagName -ceq $tag })
          if ($existing.Count -gt 1) { throw 'Multiple releases have the same version tag' }
          $published = $existing.Count -eq 1 -and -not $existing[0].isDraft

          function Confirm-ReleaseAssets {
            $downloadDir = Join-Path $env:RUNNER_TEMP ('provider-release-check-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $downloadDir | Out-Null
            foreach ($asset in $assets) {
              gh release download $tag --repo $repository --pattern $asset --dir $downloadDir
              if ($LASTEXITCODE -ne 0) { throw "Unable to verify release asset: $asset" }
              $expected = (Get-FileHash -LiteralPath (Join-Path 'outputs/provider-release' $asset) -Algorithm SHA256).Hash
              $actual = (Get-FileHash -LiteralPath (Join-Path $downloadDir $asset) -Algorithm SHA256).Hash
              if ($expected -cne $actual) { throw "Version $tag already has different content. Bump provider/version.json and create a new version tag." }
            }
          }

          if ($published) {
            if ($existing[0].isPrerelease) { throw 'The stable provider version is marked as a prerelease' }
            Confirm-ReleaseAssets
            Write-Host "$tag is already published with identical assets; no changes made."
            exit 0
          }

          foreach ($release in $releases) {
            if (-not $release.isDraft -and -not $release.isPrerelease -and $release.tagName -match '^provider-v([0-9]+\.[0-9]+\.[0-9]+)$') {
              if ([version]$Matches[1] -ge [version]$manifest.version) { throw 'A newer or equal provider version is already published' }
            }
          }
          if ($existing.Count -eq 0) {
            gh release create $tag --repo $repository --verify-tag --draft --title "Relay PC setup $($manifest.version)" --notes 'Windows PC setup with verified automatic updates. Extract relay-provider.zip and run START-PROVIDER.cmd.'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create the draft release' }
          }
          $assetPaths = @($assets | ForEach-Object { Join-Path 'outputs/provider-release' $_ })
          gh release upload $tag @assetPaths --repo $repository --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload complete provider assets' }
          Confirm-ReleaseAssets
          gh release edit $tag --repo $repository --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish the verified provider release' }

